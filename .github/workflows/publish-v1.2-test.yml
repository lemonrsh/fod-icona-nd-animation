name: Publish requested v1.2 test APK

on:
  push:
    branches:
      - arena/25856b61-fod-icona-nd-animation
    paths:
      - .github/workflows/publish-v1.2-test.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish the verified CI build and test animation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.0-test --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::The v1.2.0-test release already exists; refusing to overwrite it.'
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/fod-release"
          gh run download 42484159785 --repo "$GITHUB_REPOSITORY" \
            --name FOD-Icon-Animation-debug --dir "$RUNNER_TEMP/fod-release"
          test -f "$RUNNER_TEMP/fod-release/app-debug.apk"
          apk="$RUNNER_TEMP/FOD-Icon-Animation-v1.2-test.apk"
          cp "$RUNNER_TEMP/fod-release/app-debug.apk" "$apk"
          echo 'abf9b150597f19b480c3537dcfb667649c87e92fa22627dc59e22bc808c060be  examples/iron_man_fire_test.json' | sha256sum --check --status
          apk_sha=$(sha256sum "$apk" | cut -d' ' -f1)
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## Experimental test — fingerprint unlock success

          This build tries to play a selected Lottie animation **after a successful under-display fingerprint unlock**. It does not intentionally run the success effect continuously on AOD. It is an experimental SystemUI hook and **has not been tested on a phone**; compatibility with your ROM is not established. Keep a recovery method available to disable LSPosed/Magisk.

          1. If the previous test APK is installed, disable it in LSPosed and uninstall it first. This CI debug APK uses a different signing key; uninstalling removes the app's selected-file settings but not the original files.
          2. Install the new APK and download the separate iron_man_fire_test.json example, or use your own self-contained Lottie JSON. The example is a handmade test, not your original patch.
          3. In the app, choose the JSON under **Fingerprint unlock success effect**. Clear the **Always-on-display FOD animation** slot if you do not want a continuous AOD animation.
          4. Enable the module for **System UI** in LSPosed and reboot. Try unlocking twice if the JSON was still loading on the first attempt.

          LSPosed logs may show Unlock success hook installed, Unlock effect JSON ready, Fingerprint unlock success event observed and Fingerprint unlock success effect started. A started log does not guarantee the effect was visible.

          The APK was built and unit-tested by [GitHub Actions run 42484159785](https://github.com/$GITHUB_REPOSITORY/actions/runs/42484159785). APK SHA-256: $apk_sha.
          EOF
          gh release create v1.2.0-test "$apk" examples/iron_man_fire_test.json \
            --repo "$GITHUB_REPOSITORY" \
            --target bbcf14ab71922ab7be7eed899cc4ac5b68e1feca \
            --title 'FOD Icon & Animation 1.2.0 — unlock success test' \
            --prerelease --notes-file "$RUNNER_TEMP/release-notes.md"
