name: Publish requested test APK

on:
  push:
    branches:
      - arena/02f31f58-fod-icona-nd-animation
    paths:
      - .github/workflows/publish-test-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Upload the verified test APK and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/FOD-Icon-Animation-v1.1-test.apk"
          gh api "repos/$GITHUB_REPOSITORY/git/blobs/4ae84ac4a19b502ec05027f8c02bfd2497e32e8b" --jq .content | base64 --decode > "$apk"
          echo "948d7bec8fbb3b781ab60c304e9ad708a00745b6ecda1bd2f978515c8f631bac  $apk" | sha256sum --check --status
          gh release upload v1.1.0-test "$apk" --repo "$GITHUB_REPOSITORY"
          gh release edit v1.1.0-test --draft=false --repo "$GITHUB_REPOSITORY"
      - name: Summarize previous Android setup failure
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/128730550984/logs" > "$RUNNER_TEMP/previous-job.log" || exit 0
          python3 - "$RUNNER_TEMP/previous-job.log" <<'PY'
          import re
          import sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(errors='replace')
          for line in text.splitlines():
              if re.search(r'(^|\W)(error|exception|failed)(\W|$)', line, re.I):
                  message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')[:800]
                  print('::notice title=Prior Android setup::' + message)
          PY
