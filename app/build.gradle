plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lemonrsh.fodcustomizer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lemonrsh.fodcustomizer'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // The framework supplies this API at runtime. Never package it in the APK.
    compileOnly files('libs/xposed-api-82.jar')
    implementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'junit:junit:4.13.2'
}
